<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Vibeathon 2026 - Operations Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-deep: #030712;
      --bg-card: rgba(11, 17, 32, 0.88);
      --border: rgba(255, 255, 255, 0.09);
      --border-accent: rgba(0, 240, 255, 0.35);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.25);
      --violet: #8b5cf6;
      --pink: #ec4899;
      --pink-dim: rgba(236, 72, 153, 0.15);
      --green: #10b981;
      --text-1: #f9fafb;
      --text-2: #9ca3af;
      --text-3: #6b7280;
      --font-main: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Outfit', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-deep);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    /* Ambient Neural Background */
    .bg-canvas {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 70% 50% at 50% -10%, rgba(0, 240, 255, 0.15), transparent 70%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12), transparent 50%),
        radial-gradient(circle at 15% 90%, rgba(236, 72, 153, 0.1), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .cyber-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Top Return Link */
    .top-nav {
      position: fixed;
      top: 1.5rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.05em;
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid var(--border);
      color: var(--text-2);
      text-decoration: none;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      transition: all 0.2s;
    }

    .nav-back-btn:hover {
      color: var(--cyan);
      border-color: var(--border-accent);
      background: rgba(0, 240, 255, 0.08);
      transform: translateX(-2px);
    }

    /* Main Gateway Card */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      margin: 3.5rem auto 1.5rem;
    }

    .gateway-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      padding: 2.25rem;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(0, 240, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .gateway-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--pink), var(--violet));
    }

    /* Card Header */
    .card-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .portal-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--pink-dim);
      border: 1px solid rgba(236, 72, 153, 0.35);
      color: #f472b6;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .portal-chip .beacon {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f472b6;
      box-shadow: 0 0 8px #f472b6;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text-1);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .card-title span {
      background: linear-gradient(135deg, var(--cyan), #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-subtitle {
      font-size: 0.82rem;
      color: var(--text-2);
      line-height: 1.5;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      justify-content: space-between;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-3);
      font-size: 0.9rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-1);
      font-family: var(--font-main);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.15);
      background: rgba(15, 23, 42, 0.95);
    }

    .form-input:focus + .input-icon,
    .input-wrap:focus-within .input-icon {
      color: var(--cyan);
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      padding: 6px;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .pwd-toggle-btn:hover {
      color: var(--text-1);
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 100%);
      color: #030712;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 18px rgba(0, 240, 255, 0.3);
      margin-top: 0.5rem;
    }

    .submit-btn:hover:not(:disabled) {
      filter: brightness(1.12);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 240, 255, 0.45);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Message Banner */
    .auth-msg-box {
      margin-top: 1rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.8rem;
      display: none;
      align-items: center;
      gap: 8px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-msg-box.error {
      display: flex;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
    }

    .auth-msg-box.success {
      display: flex;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    /* Quick Fill / Credentials Hint */
    .cred-hint-box {
      margin-top: 1.5rem;
      padding: 0.85rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cred-hint-text {
      font-size: 0.75rem;
      color: var(--text-2);
      font-family: var(--font-mono);
    }

    .cred-hint-text strong {
      color: var(--cyan);
    }

    .quick-fill-btn {
      padding: 4px 10px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .quick-fill-btn:hover {
      background: var(--cyan);
      color: #030712;
    }

    /* Shortcut Footer Pill */
    .shortcut-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-3);
      font-family: var(--font-mono);
    }

    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 2px 6px;
      color: var(--text-2);
      font-size: 0.7rem;
    }
  </style>
</head>

<body>
  <!-- Ambient Gradients -->
  <div class="bg-canvas"></div>
  <div class="cyber-grid"></div>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <a href="index.html" class="brand-group" title="Back to Homepage">
      <span class="brand-name">VIBEATHON 2.0</span>
    </a>
    <a href="index.html" class="nav-back-btn">
      <i class="fas fa-arrow-left"></i>
      <span>Exit to Overview</span>
    </a>
  </header>

  <!-- Login Form Wrapper -->
  <main class="login-wrapper">
    <div class="gateway-card">
      
      <div class="card-header">
        <div class="portal-chip">
          <span class="beacon"></span>
          <span>OPERATIONS CONTROLLER</span>
        </div>
        <h1 class="card-title">Console <span>Sign In</span></h1>
        <p class="card-subtitle">
          Master administrative credentials required to access live event orchestration controls.
        </p>
      </div>

      <form id="manageLoginForm" novalidate>
        
        <!-- Username Field -->
        <div class="form-group">
          <label for="adminId">
            <span>Admin Username</span>
            <span style="color: var(--text-3);">ID</span>
          </label>
          <div class="input-wrap">
            <i class="fas fa-user-shield input-icon"></i>
            <input 
              type="text" 
              id="adminId" 
              name="adminId" 
              class="form-input" 
              placeholder="e.g. admin" 
              required 
              autocomplete="username"
              autofocus 
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="adminPassword">
            <span>Master Password</span>
            <span style="color: var(--text-3);">KEY</span>
          </label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input 
              type="password" 
              id="adminPassword" 
              name="adminPassword" 
              class="form-input" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password" 
            />
            <button type="button" class="pwd-toggle-btn" id="togglePwdBtn" title="Show/Hide password">
              <i class="far fa-eye" id="togglePwdIcon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="loginBtn">
          <i class="fas fa-terminal"></i>
          <span class="btn-text">Authenticate to Gateway</span>
        </button>

        <!-- Message Box -->
        <div id="authMsgBox" class="auth-msg-box">
          <i class="fas fa-exclamation-circle" id="msgIcon"></i>
          <span id="msgText"></span>
        </div>

        <!-- Default Credentials Quick Fill Hint -->
        <div class="cred-hint-box">
          <div class="cred-hint-text">
            <span>Organizer Demo: <strong>admin</strong> / <strong>admin123</strong></span>
          </div>
          <button type="button" class="quick-fill-btn" id="quickFillBtn" title="Auto-fill credentials">
            Auto Fill
          </button>
        </div>

      </form>

    </div>

    <!-- Shortcut Hint -->
    <div class="shortcut-footer">
      <span>Gateway shortcut: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>M</kbd></span>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/manage-login.js"></script>
</body>

</html>
